services:
  # ── Shared infra: used by both the lite (Postgres) and hadoop
  # (HDFS/YARN/Hive) paths. postgres additionally backs the Hive
  # metastore once the hadoop profile is up (see T2.3, hive-metastore.env
  # for HIVE_METASTORE_DB) — same container, a second database inside it,
  # not a second Postgres instance.
  postgres:
    image: postgres:15
    restart: unless-stopped
    profiles: ["lite", "hadoop"]
    environment:
      POSTGRES_DB: pipeline_qa
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the hive_metastore database inside this same container —
      # only runs on a fresh (empty) volume, see the script's own header.
      - ./hadoop/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d pipeline_qa"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    profiles: ["lite", "hadoop"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    profiles: ["lite", "hadoop"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Lite profile: the original Postgres-mock path. Unchanged behavior —
  # `docker compose --profile lite up` must bring up exactly what a bare
  # `docker compose up` brought up before profiles existed.
  tool_server:
    build:
      context: .
      dockerfile: agent_tools/Dockerfile
    restart: unless-stopped
    profiles: ["lite"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pipeline_qa
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_pass
      TOOL_SERVER_HOST: 0.0.0.0
      TOOL_SERVER_PORT: 8000
      INJECT_FAILURE: ${INJECT_FAILURE:-none}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent_server:
    build:
      context: .
      dockerfile: agent/Dockerfile
    restart: unless-stopped
    profiles: ["lite"]
    ports:
      - "8001:8001"
    depends_on:
      tool_server:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TOOL_SERVER_HOST: tool_server
      TOOL_SERVER_PORT: 8000
      AGENT_SERVER_HOST: 0.0.0.0
      AGENT_SERVER_PORT: 8001
      SLACK_MODE: ${SLACK_MODE:-stub}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_CHANNEL_ALERTS: ${SLACK_CHANNEL_ALERTS:-}
      SLACK_CHANNEL_P1: ${SLACK_CHANNEL_P1:-}
      SLACK_CHANNEL_CHANGES: ${SLACK_CHANNEL_CHANGES:-}
      SLACK_CHANNEL_DAILY: ${SLACK_CHANNEL_DAILY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    profiles: ["lite"]
    ports:
      - "5678:5678"
    depends_on:
      agent_server:
        condition: service_healthy
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-password}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      JENKINS_WEBHOOK_URL: ${JENKINS_WEBHOOK_URL:-}
      JENKINS_TOKEN: ${JENKINS_TOKEN:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflows:/workflows
      - ./reports:/qa/reports
      - ./tests:/qa/tests

  # ── Hadoop profile: HDFS + YARN, single-node (T2.2). Hive (T2.3) and
  # the Spark transform (T2.4) land in later commits. See
  # docs/hadoop-stack.md for acceptance checks and the honesty note on
  # what has and hasn't actually been run — image pulls are blocked in
  # the sandbox this was written in, so this is config-validated
  # (`docker compose config`) but not run end-to-end anywhere yet.
  namenode:
    image: apache/hadoop:3
    hostname: namenode
    restart: unless-stopped
    profiles: ["hadoop"]
    user: root
    # Format on first run only (detected by absence of the name dir's
    # `current/` subdirectory) — reformatting an already-formatted
    # NameNode on every restart would orphan the DataNode's blocks.
    command: >
      bash -c "if [ ! -d /opt/hadoop/data/nameNode/current ]; then
      hdfs namenode -format -force -nonInteractive; fi &&
      hdfs namenode"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    volumes:
      - ./hadoop/config:/opt/hadoop/etc/hadoop:ro
      - namenode_data:/opt/hadoop/data/nameNode
    ports:
      - "9870:9870" # NameNode web UI
      - "9000:9000" # fs.defaultFS
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  datanode:
    image: apache/hadoop:3
    hostname: datanode
    restart: unless-stopped
    profiles: ["hadoop"]
    user: root
    command: ["hdfs", "datanode"]
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    volumes:
      - ./hadoop/config:/opt/hadoop/etc/hadoop:ro
      - datanode_data:/opt/hadoop/data/dataNode
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "9864:9864" # DataNode web UI

  resourcemanager:
    image: apache/hadoop:3
    hostname: resourcemanager
    restart: unless-stopped
    profiles: ["hadoop"]
    user: root
    command: ["yarn", "resourcemanager"]
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    volumes:
      - ./hadoop/config:/opt/hadoop/etc/hadoop:ro
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_started
    ports:
      - "8088:8088" # ResourceManager web UI — acceptance check: applications list visible here
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  nodemanager:
    image: apache/hadoop:3
    hostname: nodemanager
    restart: unless-stopped
    profiles: ["hadoop"]
    user: root
    command: ["yarn", "nodemanager"]
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    volumes:
      - ./hadoop/config:/opt/hadoop/etc/hadoop:ro
    depends_on:
      resourcemanager:
        condition: service_healthy
    ports:
      - "8042:8042" # NodeManager web UI

  # ── Hive (T2.3) — metastore + HiveServer2, metastore DB on the
  # existing postgres container (see hadoop/postgres-init/). Needs a
  # live internet connection at startup to fetch the Postgres JDBC
  # driver (Hive images don't bundle one) — see docs/hadoop-stack.md if
  # that's not available where this runs.
  hive-jdbc-driver-init:
    image: curlimages/curl:8.10.1
    profiles: ["hadoop"]
    command: >
      sh -c "curl -sSf -o /jars/postgresql-42.7.3.jar
      https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar
      && echo 'postgresql JDBC driver downloaded'"
    volumes:
      - hive_jdbc_driver:/jars

  hive-metastore:
    image: apache/hive:4.0.0
    hostname: hive-metastore
    restart: unless-stopped
    profiles: ["hadoop"]
    user: root
    environment:
      SERVICE_NAME: metastore
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      # HIVE_AUX_JARS_PATH is Hive's own long-standing mechanism for
      # extra JDBC drivers — not something specific to this image, so
      # this one is the part of the Hive config here worth trusting most.
      HIVE_AUX_JARS_PATH: /jars/postgresql-42.7.3.jar
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/hive_metastore
        -Djavax.jdo.option.ConnectionUserName=qa_user
        -Djavax.jdo.option.ConnectionPassword=qa_pass
    volumes:
      - ./hadoop/config:/opt/hadoop/etc/hadoop:ro
      - ./hadoop/config/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - hive_jdbc_driver:/jars:ro
    depends_on:
      postgres:
        condition: service_healthy
      namenode:
        condition: service_healthy
      hive-jdbc-driver-init:
        condition: service_completed_successfully
    ports:
      - "9083:9083" # Thrift metastore — acceptance check: schematool -info should succeed once schema is initialised

  hiveserver2:
    image: apache/hive:4.0.0
    hostname: hiveserver2
    restart: unless-stopped
    profiles: ["hadoop"]
    user: root
    environment:
      SERVICE_NAME: hiveserver2
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HIVE_AUX_JARS_PATH: /jars/postgresql-42.7.3.jar
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    volumes:
      - ./hadoop/config:/opt/hadoop/etc/hadoop:ro
      - ./hadoop/config/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - hive_jdbc_driver:/jars:ro
    depends_on:
      hive-metastore:
        condition: service_started
      namenode:
        condition: service_healthy
    ports:
      - "10000:10000" # JDBC/Thrift — acceptance check: an external table over HDFS Parquet is queryable through here
      - "10002:10002" # Web UI

volumes:
  postgres_data:
  n8n_data:
  namenode_data:
  datanode_data:
  hive_jdbc_driver:
