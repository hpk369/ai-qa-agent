name: triage stream

# Runs the live log stream against the real model, authenticating with
# Workload Identity Federation — GitHub mints a short-lived OIDC token,
# Anthropic exchanges it for a token that expires in minutes, and no static
# API key exists anywhere in the repository or its secrets.
#
# The OIDC assertion is single-use: the issuer accepts one exchange and 401s
# every replay. Each step that authenticates is therefore preceded by its own
# mint (./.github/actions/mint-anthropic-token) rather than sharing one token
# across the job. Sharing one is not a loud failure — narration falls back to
# deterministic text and the job still reports success — so the per-step mint
# is what keeps a green run an honest one.
#
# Configure once (Settings > Secrets and variables > Actions > Variables):
#   ANTHROPIC_FEDERATION_RULE_ID    fdrl_...   from the Console's Connect workload wizard
#   ANTHROPIC_ORGANIZATION_ID       the org UUID
#   ANTHROPIC_SERVICE_ACCOUNT_ID    svac_...   the rule's target service account
#   ANTHROPIC_WORKSPACE_ID          wrkspc_... ONLY if the rule covers several
#                                   workspaces. With a rule bound to one workspace,
#                                   leave it unset — the server picks that one.
#   ANTHROPIC_OIDC_AUDIENCE         defaults to https://api.anthropic.com, which is
#                                   what the Console's GitHub Actions wizard puts in
#                                   the rule's audience matcher — override only if
#                                   your rule matches something else
#   AGENT_MODEL                     optional; defaults to claude-haiku-4-5
# These are identifiers, not secrets — variables, not secrets, so they are
# visible in the log and easy to audit.
#
# The job is skipped, not failed, until the rule id is set, so a fork or a
# fresh clone does not go red.

on:
  schedule:
    - cron: "17 7 * * 1"        # Mondays, 07:17 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds to stream for
        default: "120"
      rate:
        description: Log lines per second
        default: "8"

permissions:
  contents: read
  id-token: write               # required to mint the OIDC token

concurrency:
  group: triage-stream
  cancel-in-progress: false

jobs:
  stream:
    name: stream and triage
    runs-on: ubuntu-latest
    # The Slack credentials live in a GitHub Environment, and an environment's
    # secrets and variables reach only a job that names it. Without this line
    # `secrets.SLACK_BOT_TOKEN` below resolves to the empty string, SLACK_MODE
    # computes to "stub", and the run posts nothing while still going green.
    environment: SLACK_BOT_TOKEN
    timeout-minutes: 15
    # Evaluated before the environment is resolved, so this must stay a
    # repository-level variable: an environment-scoped one reads as empty here
    # and would skip the job outright.
    if: vars.ANTHROPIC_FEDERATION_RULE_ID != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mint an OIDC token for the credential check
        uses: ./.github/actions/mint-anthropic-token
        with:
          audience: ${{ vars.ANTHROPIC_OIDC_AUDIENCE || 'https://api.anthropic.com' }}
          file-name: anthropic-oidc-verify.jwt

      - name: Verify the credential end to end
        # Resolves the credential, then makes one small real call — a few
        # tokens, a fraction of a cent. Without it the run would still
        # "succeed": an unresolved credential falls back to deterministic
        # narration, which looks like a quiet model rather than a broken
        # setup. This is also what completes the Console wizard's
        # connection test.
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
        run: |
          set -euo pipefail
          for name in ANTHROPIC_WORKSPACE_ID AGENT_MODEL; do
            if [ -z "${!name:-}" ]; then unset "${name}"; fi
          done
          python scripts/check_credentials.py --live --show-claims \
            --expect "workload identity federation"

      - name: Fetch the public log corpus
        # Optional: without it the stream generates its background instead.
        continue-on-error: true
        run: python scripts/fetch_logs.py

      - name: Mint a fresh OIDC token for the stream
        # The check above spent the previous assertion, and the issuer rejects a
        # replay with a 401. Without a second token this step authenticated with
        # a spent one: every narration fell back to deterministic text while the
        # job still reported success, because a failed narration is non-fatal.
        uses: ./.github/actions/mint-anthropic-token
        with:
          audience: ${{ vars.ANTHROPIC_OIDC_AUDIENCE || 'https://api.anthropic.com' }}
          file-name: anthropic-oidc-stream.jwt

      - name: Stream and triage
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          # Slack stays in stub mode unless a bot token is configured; the
          # payloads are uploaded with the run either way.
          SLACK_MODE: ${{ secrets.SLACK_BOT_TOKEN != '' && 'live' || 'stub' }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ALERTS: ${{ vars.SLACK_CHANNEL_ALERTS }}
          SLACK_CHANNEL_P1: ${{ vars.SLACK_CHANNEL_P1 }}
          SLACK_CHANNEL_CHANGES: ${{ vars.SLACK_CHANNEL_CHANGES }}
        run: |
          set -euo pipefail
          # An unset Actions variable arrives as an empty string, not as an
          # absent variable. Drop the empties before calling Python: a blank
          # ANTHROPIC_WORKSPACE_ID would otherwise be carried into the token
          # exchange, where the server expects the field to be absent when the
          # rule covers a single workspace.
          for name in ANTHROPIC_WORKSPACE_ID AGENT_MODEL SLACK_CHANNEL_ALERTS \
                      SLACK_CHANNEL_P1 SLACK_CHANNEL_CHANGES SLACK_BOT_TOKEN; do
            if [ -z "${!name:-}" ]; then unset "${name}"; fi
          done
          python scripts/stream.py \
            --duration "${{ inputs.duration || '120' }}" \
            --rate "${{ inputs.rate || '8' }}" \
            --gap 20 40 \
            --poll 5 \
            --auto-resolve 30 \
            --max-block-wait 90
          # --auto-resolve: nobody is watching Slack on a scheduled run, so a
          # blocking incident releases itself rather than holding the runner
          # until max-block-wait. Drop it to see the gate hold for real.

      - name: Report what the run cost in incidents
        if: always()
        run: python scripts/incident_metrics.py || true

      - name: Upload the log sets, incidents and Slack payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-run-${{ github.run_number }}
          path: |
            reports/logsets/**
            reports/incidents/**
            reports/slack/**
          retention-days: 7
          if-no-files-found: warn
