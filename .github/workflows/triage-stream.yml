name: triage stream

# Runs the live log stream against the real model, authenticating with
# Workload Identity Federation — GitHub mints a short-lived OIDC token for
# this job, Anthropic exchanges it for a token that expires in minutes, and
# no static API key exists anywhere in the repository or its secrets.
#
# Configure once (Settings > Secrets and variables > Actions > Variables):
#   ANTHROPIC_FEDERATION_RULE_ID    fdrl_...   from the Console's Connect workload wizard
#   ANTHROPIC_ORGANIZATION_ID       the org UUID
#   ANTHROPIC_SERVICE_ACCOUNT_ID    svac_...   the rule's target service account
#   ANTHROPIC_WORKSPACE_ID          wrkspc_... ONLY if the rule covers several
#                                   workspaces. With a rule bound to one workspace,
#                                   leave it unset — the server picks that one.
#   ANTHROPIC_OIDC_AUDIENCE         defaults to https://api.anthropic.com, which is
#                                   what the Console's GitHub Actions wizard puts in
#                                   the rule's audience matcher — override only if
#                                   your rule matches something else
#   AGENT_MODEL                     optional; defaults to claude-haiku-4-5
# These are identifiers, not secrets — variables, not secrets, so they are
# visible in the log and easy to audit.
#
# The job is skipped, not failed, until the rule id is set, so a fork or a
# fresh clone does not go red.

on:
  schedule:
    - cron: "17 7 * * 1"        # Mondays, 07:17 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds to stream for
        default: "120"
      rate:
        description: Log lines per second
        default: "8"

permissions:
  contents: read
  id-token: write               # required to mint the OIDC token

concurrency:
  group: triage-stream
  cancel-in-progress: false

jobs:
  stream:
    name: stream and triage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.ANTHROPIC_FEDERATION_RULE_ID != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mint a GitHub OIDC token for Anthropic
        env:
          # The federation rule matches the token's `aud` claim exactly. GitHub's
          # own default audience is the repository owner URL, which would not
          # match a rule built by the Console wizard, so ask for the documented
          # one unless a variable says otherwise.
          AUDIENCE: ${{ vars.ANTHROPIC_OIDC_AUDIENCE || 'https://api.anthropic.com' }}
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(printf %s "${AUDIENCE}" | jq -sRr @uri)"
          echo "requesting an OIDC token with audience ${AUDIENCE}"
          token_file="${RUNNER_TEMP}/anthropic-oidc.jwt"
          umask 077
          # The JWT goes straight to a file: never echoed, never in the log.
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${url}" \
            | jq -r '.value' > "${token_file}"
          if [ ! -s "${token_file}" ] || [ "$(head -c 2 "${token_file}")" != "ey" ]; then
            echo "::error::did not receive an OIDC token from GitHub"
            exit 1
          fi
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=${token_file}" >> "${GITHUB_ENV}"
          echo "minted an OIDC token ($(wc -c < "${token_file}") bytes)"

      - name: Verify federation is what authenticates
        # Without this the run would still "succeed": an unresolved
        # credential silently falls back to deterministic narration, which
        # looks like a quiet model rather than a broken setup.
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
        run: |
          set -euo pipefail
          # An unset Actions variable arrives as an empty string, not as an
          # absent variable. Drop the empties before calling Python: a blank
          # ANTHROPIC_WORKSPACE_ID would otherwise be carried into the token
          # exchange, where the server expects the field to be absent when the
          # rule covers a single workspace.
          for name in ANTHROPIC_WORKSPACE_ID AGENT_MODEL SLACK_CHANNEL_ALERTS \
                      SLACK_CHANNEL_P1 SLACK_CHANNEL_CHANGES SLACK_BOT_TOKEN; do
            if [ -z "${!name:-}" ]; then unset "${name}"; fi
          done
          source=$(python -c "from agent.providers import AnthropicProvider as A; print(A.credential_source())")
          echo "credential source: ${source}"
          python -c "from agent import llm; print('model layer:', llm.describe())"
          if [ "${source}" != "workload identity federation" ]; then
            echo "::error::expected federation, got '${source}' — check the workflow's variables"
            exit 1
          fi

      - name: Fetch the public log corpus
        # Optional: without it the stream generates its background instead.
        continue-on-error: true
        run: python scripts/fetch_logs.py

      - name: Stream and triage
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          # Slack stays in stub mode unless a bot token is configured; the
          # payloads are uploaded with the run either way.
          SLACK_MODE: ${{ secrets.SLACK_BOT_TOKEN != '' && 'live' || 'stub' }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ALERTS: ${{ vars.SLACK_CHANNEL_ALERTS }}
          SLACK_CHANNEL_P1: ${{ vars.SLACK_CHANNEL_P1 }}
          SLACK_CHANNEL_CHANGES: ${{ vars.SLACK_CHANNEL_CHANGES }}
        run: |
          set -euo pipefail
          # An unset Actions variable arrives as an empty string, not as an
          # absent variable. Drop the empties before calling Python: a blank
          # ANTHROPIC_WORKSPACE_ID would otherwise be carried into the token
          # exchange, where the server expects the field to be absent when the
          # rule covers a single workspace.
          for name in ANTHROPIC_WORKSPACE_ID AGENT_MODEL SLACK_CHANNEL_ALERTS \
                      SLACK_CHANNEL_P1 SLACK_CHANNEL_CHANGES SLACK_BOT_TOKEN; do
            if [ -z "${!name:-}" ]; then unset "${name}"; fi
          done
          python scripts/stream.py \
            --duration "${{ inputs.duration || '120' }}" \
            --rate "${{ inputs.rate || '8' }}" \
            --gap 20 40 \
            --poll 5 \
            --auto-resolve 30 \
            --max-block-wait 90
          # --auto-resolve: nobody is watching Slack on a scheduled run, so a
          # blocking incident releases itself rather than holding the runner
          # until max-block-wait. Drop it to see the gate hold for real.

      - name: Report what the run cost in incidents
        if: always()
        run: python scripts/incident_metrics.py || true

      - name: Upload the log sets, incidents and Slack payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-run-${{ github.run_number }}
          path: |
            reports/logsets/**
            reports/incidents/**
            reports/slack/**
          retention-days: 7
          if-no-files-found: warn
